<mat-tab-group mat-stretch-tabs [(selectedIndex)]="selectedTabIndex" >

  <mat-tab label="Login" id="tab-login">
    <app-login></app-login>
  </mat-tab>

  <mat-tab label="Register" id="tab-register">
    <app-register (switchToLogin)="goToLoginTab()" ></app-register>
  </mat-tab>

</mat-tab-group>
